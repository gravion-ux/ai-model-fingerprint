[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-fingerprint"
version = "0.1.0"
description = "Fingerprint AI model files and verify integrity manifests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Kumar Thakur" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ai-model-fingerprint = "ai_model_fingerprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
